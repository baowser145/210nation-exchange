<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The 210Nation Exchange</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one dark exchange board — four-tile strip up top, stat board below. Single-theme by design. */
:root{
  --bg:#0a0e16;
  --panel:#101624;
  --panel2:#0d1320;
  --line:#1c2638;
  --fg:#e9edf4;
  --dim:#8a95a9;
  --amber:#f3b63f;
  --up:#35d17c;
  --down:#ff6262;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;line-height:1.45;margin:0;padding-block:0 48px}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px}
a{color:var(--amber)}
.num{font-variant-numeric:tabular-nums}

/* play chip (Current box) */
.ev{animation:pop .45s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.tk{display:inline-flex;gap:7px;margin-right:28px;font-size:12px}
#currPlay{margin-top:4px}
#currPlay .tk{display:grid;grid-template-columns:auto 1fr;gap:1px 7px;margin:0;font-size:13px}
#currPlay .pl{grid-column:2;font-size:17px;font-weight:600}
.tk .sym{color:var(--amber);font-weight:600}
.tk .px{color:var(--fg)}
.tk .tknm{color:var(--fg);font-weight:600}
.tk .tkdelta{font-weight:600}

/* header */
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-block:22px 4px}
h1{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;letter-spacing:.5px;margin:0;text-wrap:balance}
h1 .x{color:var(--amber)}
.mkt{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.mkt .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;vertical-align:1px}
.mkt.live .dot{background:var(--up)}
.sub{color:var(--dim);margin:2px 0 18px;max-width:62ch}

/* composite strip */
.strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.idx{flex:1 1 150px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;min-width:0}
.idx .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.idx .val{font-family:var(--disp);font-size:26px;font-weight:600;line-height:1.15}
#gainer,#loser,#potnName{font-size:19px;line-height:1.3}
.potnb{display:inline-block;font-size:9px;letter-spacing:.08em;color:#121212;background:var(--amber);padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px;font-weight:600}
#potn{border-color:var(--amber)}
#potnLine{color:var(--amber)}
.idx .chg{font-size:11px}
.idx .games{font-size:12px;line-height:1.7;margin-top:3px}
.idx .games .gm-live{color:var(--up)}
.idx .games .gm-sc{color:var(--fg);font-weight:600}

/* controls */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:12px;background:var(--panel);color:var(--dim);border:1px solid var(--line);padding:6px 13px;cursor:pointer}
.tabs button[aria-pressed="true"]{color:#121212;background:var(--amber);border-color:var(--amber);font-weight:600}
button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}

/* board */
.board{border:1px solid var(--line);background:var(--panel)}
.row,.hd{display:grid;grid-template-columns:30px minmax(130px,1fr) 64px 84px 92px;gap:10px;align-items:center;padding:9px 14px}
.hd{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--panel);z-index:2}
.row{border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--panel2)}
.rk{color:var(--dim);font-size:11px}
.sechd{padding:7px 14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);background:var(--panel2);border-bottom:1px solid var(--line)}
.more{display:block;width:100%;font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--panel);color:var(--dim);border:1px solid var(--line);border-top:0;padding:10px;cursor:pointer}
.more:hover{color:var(--amber)}
.who{min-width:0}
.who .sym{color:var(--amber);font-weight:600}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:12px}
.who .tm{color:var(--dim);font-size:10px;letter-spacing:.08em}
.cell{text-align:right;white-space:nowrap}
.last{color:var(--dim)}
.px{font-weight:600}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--dim)}


/* detail drawer */
.detail{grid-column:1/-1;background:var(--panel2);border-top:1px solid var(--line);margin:9px -14px -9px;padding:14px 16px}
.detail .dstats{display:flex;flex-wrap:wrap;gap:8px 26px;margin-bottom:10px;font-size:12px}
.detail .dstats .k{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block}
.detail canvas{width:100%;height:150px;display:block}
.legend{display:flex;gap:18px;margin-top:6px;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.legend i{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:5px}

/* live game day */
.livepx{color:var(--amber)}
.ldot{color:var(--up);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{background:rgba(243,182,63,.35)}to{background:transparent}}
.mkt.live #mktTxt{color:var(--up)}
@media (prefers-reduced-motion:reduce){.ldot,.flash{animation:none}}

footer{color:var(--dim);font-size:11px;margin-top:22px;max-width:70ch}
.err{border:1px solid var(--down);color:var(--down);padding:12px 14px;margin-block:14px;display:none}

@media (max-width:640px){
  h1{font-size:30px}
  .strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .idx{padding:8px 10px}
  .idx .val{font-size:21px}
  #gainer,#loser,#potnName{font-size:16px}
  .idx .lbl{font-size:9px;letter-spacing:.1em}
  .hd{display:none}
  .rk{display:none}
  .row{grid-template-areas:"who who who who" ". last px chg";grid-template-columns:1fr 58px 64px 86px;gap:6px 8px;padding:11px 10px}
  .row .who{grid-area:who}
  .row .c-last{grid-area:last}
  .row .c-px{grid-area:px}
  .row .c-chg{grid-area:chg}
  .row .cell::before{content:attr(data-l);display:block;font-size:9px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
  .who .nm{font-size:13px}
  .sechd{padding:7px 10px}
  .detail{margin:9px -10px -11px}
}
</style>

<div class="wrap">
<header>
  <h1>THE 210NATION E<span class="x">X</span>CHANGE</h1>

  <div id="rows"></div>
</div>
<button class="more" id="moreBtn" hidden>Load 25 more</button>

<footer id="foot"></footer>
</div>

/* play-by-play: diff each poll's box lines; the Current box shows one play at a time */
const prevBox = {};       // playerId -> last seen box line
const EV_LABEL = {pts:1, reb:1, ast:1, stl:1, blk:1};   // stats that produce a play
const playHtml = (name, total) => `<span class="tk ev"><span class="ldot">●</span><span class="tknm">${name}</span>`
  + `<span class="pl num up">${total}</span></span>`;
const EV_TOTAL = {pts:"PTS", reb:"REB", ast:"AST", stl:"STL", blk:"BLK"};
function emitEvents(id, name, line){
  const prev = prevBox[id];
  prevBox[id] = {pts:line.pts, reb:line.reb, ast:line.ast, stl:line.stl, blk:line.blk};
  if (!prev) return [];
  const out = [];
  for (const k in EV_LABEL){
    const d = (line[k] || 0) - (prev[k] || 0);
    if (d > 0) out.push(playHtml(name, `${line[k]} ${EV_TOTAL[k]}`));
  }
  return out;
}
const playQueue = [];
function pushEvents(htmlList){
  playQueue.push(...htmlList);
  while (playQueue.length > 30) playQueue.shift();
}

  currPlay.innerHTML = playQueue.length ? playQueue.shift() : "";

/* ---------- symbols ---------- */
const SUFFIX = /\s+(jr\.?|sr\.?|ii|iii|iv|v)$/i;
function makeSymbols(players){
  const used = new Set();
  for (const p of players){
    const name = p.name.replace(SUFFIX,"");
    const parts = name.trim().split(/\s+/);
    const last = parts[parts.length-1];
    let sym;
    if (last.includes("-")){
      sym = (parts[0][0] + last.split("-").map(s=>s[0]).join("")).toUpperCase();
    } else {
      sym = last.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
    }
    let s = sym, n = 2;
    while (used.has(s)) s = sym.slice(0,3) + n++;
    used.add(s);
    p.sym = s;
  }
}

/* ---------- math ---------- */
const val = (g) => statKey === "pra" ? g.pts + g.reb + g.ast : statKey === "imp" ? (g.gs || 0) : g[statKey];
const avg = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0) / arr.length : 0;
// tonight's box-score line stands in for tonight's game: the game log lags, and can list
// an in-progress game with empty stats
function seasonGames(p){
  const l = liveMap[p.id];
  if (data.season !== 2027 || !l || l.state === "pre" || !l.eid) return p.games;
  return p.games.filter(g => g.eid !== l.eid)
    .concat([{eid: l.eid, min: l.min, pts: l.pts, reb: l.reb, ast: l.ast, stl: l.stl, blk: l.blk, tpm: l.tpm, gs: l.gs}]);
}
function metrics(p){
  const v = seasonGames(p).map(val);
  const season = avg(v);
  const l10 = avg(v.slice(-10));
  // until a player has 11+ games, L10 *is* his season average, so there is no move to show
  const ready = v.length > 10;
  const chg = ready ? l10 - season : 0;
  const pct = ready && season > 0 ? chg / season * 100 : null;
  // the day's move: his latest finished game against his average before it (a game in progress doesn't count)
  const live = liveMap[p.id];
  const done = live && live.state === "in" ? v.slice(0, -1) : v;
  const prior = avg(done.slice(0, -1));
  const latest = done[done.length-1];
  const move = done.length >= 2 && prior > 0 ? (latest - prior) / prior * 100 : null;
  return {v, season, l10, chg, pct, move, latest, prior, last: v[v.length-1] ?? 0, hi: Math.max(0,...v), lo: v.length?Math.min(...v):0};
}
const liveVal = (l) => statKey === "pra" ? l.pts + l.reb + l.ast : statKey === "imp" ? (l.gs || 0) : (l[statKey] || 0);
// the board floor: 15+ minutes and 8+ points a game, this season
const qualifies = (p) => p.games.length
  && avg(p.games.map(g => g.min)) >= 15
  && avg(p.games.map(g => g.pts)) > 8;   // live lines are added after this check, so a first game counts once it's over
const f1 = (x) => x.toFixed(1);
const fi = (x) => Number.isInteger(x) ? String(x) : x.toFixed(1);   // single-game stats are whole numbers
const sgn = (x) => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(1);
const cls = (x) => Math.abs(x) < 0.05 ? "flat" : x > 0 ? "up" : "down";
const arrow = (x) => Math.abs(x) < 0.05 ? "·" : x > 0 ? "▲" : "▼";

/* ---------- render ---------- */
function render(){
  const players = data.players.map(p => ({p, m: metrics(p)}));
  const pctKey = x => x.m.pct ?? -Infinity;
  players.sort((a,b) => (pctKey(b) - pctKey(a)) || (b.m.l10 - a.m.l10));

  // movers
  // rotation players only (the board floor), so a deep-bench cameo can't top the list
  const movers = players.filter(x => x.m.move !== null && qualifies(x.p)).sort((a,b) => b.m.move - a.m.move);
  const moveTxt = m => `${arrow(m.move)} ${sgn(m.move)}% · ${fi(m.latest)} vs ${f1(m.prior)} avg`;
  if (movers.length){
    const g = movers[0], l = movers[movers.length-1];
    gainer.textContent = g.p.name; gainerChg.textContent = moveTxt(g.m); gainerChg.className = "chg num " + cls(g.m.move);
    loser.textContent = l.p.name; loserChg.textContent = moveTxt(l.m); loserChg.className = "chg num " + cls(l.m.move);
  } else {
    gainer.textContent = loser.textContent = "—";
    gainerChg.textContent = loserChg.textContent = "Starts after 2 games";
    gainerChg.className = loserChg.className = "chg num flat";
  }


  // rows — on game days, today's slate gets its own section up top
  const rowHTML = ({p,m}, i) => {
    const l = liveMap[p.id];
    let liveLine = "", lastCell = fi(m.last);
    if (l){
      if (l.state === "pre") liveLine = ` · TONIGHT ${l.detail} vs ${l.opp}`;
      else {
        const lv = liveVal(l);
        const key = p.id + ":" + statKey;
        const flash = prevLive[key] !== undefined && prevLive[key] !== lv ? " flash" : "";
        prevLive[key] = lv;
        lastCell = `<span class="livepx${flash}">${fi(lv)}</span>`;
        liveLine = l.state === "in"
          ? ` · <span class="ldot">●</span> LIVE · ${l.score}`
          : ` · FINAL · ${l.score}`;
      }
    }
    return `
    <button class="row" data-id="${p.id}" aria-expanded="${p.id===openId}">
      <span class="rk num">${i+1}</span>
      <span class="who"><span class="nm">${p.name} (${(l && l.team) || p.team})${potnBadge(p.id)}</span><span class="tm">${m.v.length} GP${liveLine}</span></span>
      <span class="cell num last c-last" data-l="${l && l.state !== "pre" ? "Tonight" : "Last"}">${lastCell}</span>
      <span class="cell num px c-px" data-l="Avg L10">${f1(m.l10)}</span>
      ${m.pct === null ? '<span class="cell c-chg flat" data-l="Δ%" title="Shows once he has 11+ games">—</span>' : `<span class="cell num c-chg ${cls(m.chg)}" data-l="Δ%">${arrow(m.chg)} ${sgn(m.pct)}%</span>`}
      ${p.id === openId ? detailHTML(p, m) : ""}
    </button>`;};
  // today's slate: live games first, then finals, then later tips; each ranked by tonight's numbers
  const sec = t => `<div class="sechd">${t}</div>`;
  const byTonight = (a,b) => (liveVal(liveMap[b.p.id]) - liveVal(liveMap[a.p.id])) || (b.m.l10 - a.m.l10);
  const inState = st => players.filter(x => liveMap[x.p.id] && liveMap[x.p.id].state === st);
  const groups = [
    ["Live now", inState("in").sort(byTonight)],
    ["Final today", inState("post").sort(byTonight)],
    ["Later today", inState("pre")],
  ].filter(([, list]) => list.length);
  if (groups.length){
    const rest = players.filter(x => !liveMap[x.p.id]);
    rows.innerHTML = groups.map(([t, list]) => sec(`${t} · ${list.length}`) + list.map(rowHTML).join("")).join("")
      + sec(`Rest of board · ${rest.length}`) + rest.map(rowHTML).join("");
  } else {
    rows.innerHTML = players.map(rowHTML).join("");
  }

  if (openId){
    const p = data.players.find(x => x.id === openId);
    if (p) drawChart(document.getElementById("ch-"+p.id), p);
  }
}

function detailHTML(p, m){
  const l5 = avg(m.v.slice(-5));
  const l = liveMap[p.id];
  const tonight = l && l.state !== "pre"
    ? `<span><span class="k">Tonight</span><span class="num livepx">${fi(liveVal(l))} ${STATS.find(s=>s.key===statKey).label} · ${l.state === "in" ? l.detail : "FINAL"}</span></span>`
    : "";
  return `<span class="detail">
    <span class="dstats">${tonight}
      <span><span class="k">Season avg</span><span class="num">${f1(m.season)}</span></span>
      <span><span class="k">Last 5</span><span class="num">${f1(l5)}</span></span>
      <span><span class="k">Last 10</span><span class="num">${f1(m.l10)}</span></span>
      <span><span class="k">Season high</span><span class="num">${f1(m.hi)}</span></span>
      <span><span class="k">Season low</span><span class="num">${f1(m.lo)}</span></span>
    </span>
    <canvas id="ch-${p.id}" height="150"></canvas>
    <span class="legend"><span><i style="background:var(--amber)"></i>game ${STATS.find(s=>s.key===statKey).label}</span><span><i style="background:var(--dim)"></i>season avg</span></span>
  </span>`;
}

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawChart(canvas, p){
  if (!canvas) return;
  const m = metrics(p);
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 600, H = 150;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr,dpr);
  const padL = 26, padR = 4, padT = 8, padB = 4;
  const hi = Math.max(m.hi, 1);
  const y = (v) => padT + (H-padT-padB) * (1 - v/hi);
  const n = m.v.length;
  const bw = Math.max(1, (W-padL-padR)/n - 1.2);
  // gridlines at 0, half, hi
  ctx.strokeStyle = cssVar("--line"); ctx.lineWidth = 1;
  ctx.fillStyle = cssVar("--dim"); ctx.font = "9px " + cssVar("--mono"); ctx.textAlign = "right";
  for (const gv of [0, Math.round(hi/2), Math.round(hi)]){
    const gy = y(gv);
    ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(W-padR, gy); ctx.stroke();
    ctx.fillText(String(gv), padL-5, gy+3);
  }
  // bars
  const amber = cssVar("--amber");
  m.v.forEach((v,i) => {
    const x = padL + (W-padL-padR) * i/n;
    ctx.fillStyle = amber;
    ctx.globalAlpha = i >= n-10 ? 0.95 : 0.45;
    ctx.fillRect(x, y(v), bw, H-padB-y(v));
  });
  ctx.globalAlpha = 1;
  // season average line (the Δ% reference)
  ctx.strokeStyle = cssVar("--dim"); ctx.setLineDash([4,3]);
  const by = y(m.season);
  ctx.beginPath(); ctx.moveTo(padL, by); ctx.lineTo(W-padR, by); ctx.stroke();
  ctx.setLineDash([]);
}

const tabsEl = document.getElementById("tabs");
tabsEl.innerHTML = STATS.map(s => `<button data-stat="${s.key}" aria-pressed="${s.key===statKey}"${s.key === "imp" ? " hidden" : ""}>${s.label}</button>`).join("");
tabsEl.addEventListener("click", e => {
  const b = e.target.closest("button[data-stat]"); if (!b) return;
  statKey = b.dataset.stat;
  for (const x of tabsEl.children) x.setAttribute("aria-pressed", x === b);
  render();
});
document.getElementById("rows").addEventListener("click", e => {
  const r = e.target.closest(".row"); if (!r) return;
  openId = openId === r.dataset.id ? null : r.dataset.id;
  render();
});
addEventListener("resize", () => { if (openId) render(); });

function useSnapshot(){
  data = {seasonLabel: SNAPSHOT.season, season: 2026, live:false, players: SNAPSHOT.players.filter(qualifies)};
  makeSymbols(data.players);
  mktTxt.textContent = `OFFSEASON · ${SNAPSHOT.season} FINAL BOARD`;
  foot.textContent = `Price is a player's last-10-game average for the chosen stat; Δ% is that form against their season average. Board floor: 15+ minutes and 8+ points a game. Unofficial fan project. Stats: ESPN public API, ${SNAPSHOT.season} regular season, snapshot ${SNAPSHOT.asOf}.`;
  render();
}

const API = "https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba";
const Q = "region=us&lang=en&contentorigin=espn";
async function j(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }

async function loadPlayer(id, name, team, season){
  const gl = await j(`${API}/athletes/${id}/gamelog?${Q}&season=${season}`);
  const names = gl.names || [];
  const ix = {};
  for (const k of ["minutes","points","totalRebounds","assists","steals","blocks","threePointFieldGoalsMade-threePointFieldGoalsAttempted",
                   "fieldGoalsMade-fieldGoalsAttempted","freeThrowsMade-freeThrowsAttempted","turnovers","fouls"])
    ix[k] = names.indexOf(k);
  const num = (stats,k) => { const i = ix[k]; if (i<0 || i>=stats.length) return 0; const v = parseFloat(String(stats[i]).split("-")[0]); return isNaN(v)?0:v; };
  const att = (stats,k) => { const i = ix[k]; if (i<0 || i>=stats.length) return 0; const v = parseFloat(String(stats[i]).split("-")[1]); return isNaN(v)?0:v; };
  // Game Score; game logs don't split rebounds, so each counts 0.4 (league-typical blend of 0.7 offensive, 0.3 defensive)
  const gs = s => num(s,"points") + 0.4*num(s,"fieldGoalsMade-fieldGoalsAttempted") - 0.7*att(s,"fieldGoalsMade-fieldGoalsAttempted")
    - 0.4*(att(s,"freeThrowsMade-freeThrowsAttempted") - num(s,"freeThrowsMade-freeThrowsAttempted"))
    + 0.4*num(s,"totalRebounds") + num(s,"steals") + 0.7*num(s,"assists") + 0.7*num(s,"blocks")
    - 0.4*num(s,"fouls") - num(s,"turnovers");
  const games = [];
  for (const st of gl.seasonTypes || []){
    if (!/Regular Season/.test(st.displayName || "")) continue;
    for (const cat of st.categories || [])
      for (const ev of cat.events || []){
        const meta = (gl.events || {})[ev.eventId] || {};
        games.push({eid: String(ev.eventId), d: meta.gameDate || "", opp:(meta.opponent||{}).abbreviation || "",
          min:num(ev.stats,"minutes"), pts:num(ev.stats,"points"), reb:num(ev.stats,"totalRebounds"),
          ast:num(ev.stats,"assists"), stl:num(ev.stats,"steals"), blk:num(ev.stats,"blocks"),
          tpm:num(ev.stats,"threePointFieldGoalsMade-threePointFieldGoalsAttempted"), gs: gs(ev.stats)});
      }
  }
  games.sort((x,y) => x.d < y.d ? -1 : 1);
  return {id: String(id), name, team, games};
}

async function fetchPlayers(season, page, limit){
  const lead = await j(`${API}/statistics/byathlete?${Q}&limit=${limit}&page=${page}&sort=offensive.avgPoints:desc&season=${season}&seasontype=2`);
  if (!lead.athletes || !lead.athletes.length) return [];
  return Promise.all(lead.athletes.map(row => {
    const a = row.athlete;
    return loadPlayer(a.id, a.displayName, a.teamShortName || a.teamName || "", season);
  }));
}

let morePage = 0;
async function tryLive(){
  for (const season of [2027, 2026]){
    try {
      const players = (await fetchPlayers(season, 1, 100)).filter(p => p.games.length >= 1 && qualifies(p));
      if (players.length < 8) continue;
      const label = season === 2027 ? "2026-27" : "2025-26";
      data = {seasonLabel: label, season, live:true, players};
      autoTried.clear();   // the fresh board dropped any auto-added scorers; let the next poll re-add them
      makeSymbols(data.players);
      morePage = 5;                       // pages of 25; first 100 are loaded
      tabsEl.querySelector('[data-stat="imp"]').hidden = false;
      moreBtn.hidden = false;
      document.getElementById("mkt").classList.add("live");
      mktTxt.textContent = `LIVE FEED · ${label} SEASON`;
      foot.textContent = season === 2027
        ? `L10 is a player's average over his last 10 games this season (all of them, early on). Δ% compares L10 to his season average and appears once he has 11+ games. Impact is Hollinger's Game Score. Board floor: 15+ minutes and 8+ points a game. Unofficial fan project. Stats: ESPN public API, ${label} regular season, fetched live.`
        : `L10 is a player's last-10-game average for the chosen stat; Δ% is that form against their season average. Board floor: 15+ minutes and 8+ points a game. Unofficial fan project. Stats: ESPN public API, ${label} regular season, fetched live.`;
      render();
      return;
    } catch (e) { /* blocked or down — keep the snapshot */ }
  }
}

async function loadMore(){
  moreBtn.disabled = true; moreBtn.textContent = "Loading…";
  try {
    const have = new Set(data.players.map(p => p.id));
    const batch = await fetchPlayers(data.season, morePage++, 25);
    const add = batch.filter(p => p.games.length >= 1 && qualifies(p) && !have.has(p.id));
    data.players = data.players.concat(add);
    makeSymbols(data.players);
    render();
    // the list is sorted by scoring, so an empty batch means the floor is reached
    if (!batch.length || !add.length) moreBtn.hidden = true;
  } catch (e) { moreBtn.hidden = true; }
  moreBtn.disabled = false; moreBtn.textContent = "Load 25 more";
}
moreBtn.addEventListener("click", loadMore);

/* ---------- game day: scoreboard + live box scores ---------- */
const SB = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba";

// Player of the Night: best Hollinger game score across everyone in today's box scores.
// The most recent completed night's winner wears the ★ POTN badge until someone takes it.
let potnWinnerId = null;
let todayPotn = false;    // tonight's leader owns the tile once the box scores show one
const potnBadge = (id) => id === potnWinnerId ? ' <span class="potnb" title="Reigning Player of the Night">★ POTN</span>' : "";

function gsLine(keys, sv){
  if (!sv.length) return null;
  const num = k => { const i = keys.indexOf(k); const v = parseFloat(String(sv[i] ?? "").split("-")[0]); return isNaN(v) ? 0 : v; };
  const pair = k => { const i = keys.indexOf(k); const parts = String(sv[i] ?? "").split("-"); return [parseFloat(parts[0]) || 0, parseFloat(parts[1]) || 0]; };
  const [fgm, fga] = pair("fieldGoalsMade-fieldGoalsAttempted");
  const [ftm, fta] = pair("freeThrowsMade-freeThrowsAttempted");
  const gs = num("points") + 0.4*fgm - 0.7*fga - 0.4*(fta - ftm)
    + 0.7*num("offensiveRebounds") + 0.3*num("defensiveRebounds")
    + num("steals") + 0.7*num("assists") + 0.7*num("blocks")
    - 0.4*num("fouls") - num("turnovers");
  return {gs, pts: num("points"), reb: num("rebounds"), ast: num("assists")};
}

function setPotn(b, final){
  potn.hidden = false;
  potnLbl.textContent = "Player of the Night";
  potnName.textContent = b.name;
  potnLine.innerHTML = `Impact ${f1(b.gs)}<br>${b.pts} PTS, ${b.reb} REB, ${b.ast} AST`;
}

let pollGen = 0;          // a poll that started before a newer one, or before the board reloaded, throws its results away
async function pollLive(){
  const gen = ++pollGen, board0 = data;
  const stale = () => gen !== pollGen || data !== board0;
  let events;
  try { events = (await j(`${SB}/scoreboard`)).events || []; }
  catch (e) { return; }               // fetch blocked or feed down — no live layer
  if (stale()) return;
  if (!events.length){ liveMap = {}; return; }

  // pull every started game's box score at once
  const started = events.filter(e => e.status.type.state !== "pre");
  const sums = await Promise.all(started.map(e => j(`${SB}/summary?event=${e.id}`).catch(() => null)));
  if (stale()) return;

  const boardIds = new Set(data.players.map(p => String(p.id)));
  const newMap = {};
  const extras = [];   // anyone in tonight's box scores who has scored but isn't on the board yet
  const inGame = [];   // [id, name, line] for the play feed
  let best = null;
  for (const e of events){
    const st = e.status.type;         // state: pre | in | post
    const comp = (e.competitions || [])[0] || {};
    const teams = (comp.competitors || []).map(c => c.team);
    if (st.state === "pre"){
      // tag board players by team; tip time without the date prefix
      const when = (st.shortDetail || "").replace(/^\d+\/\d+ - /, "");
      for (const p of data.players){
        const mine = teams.find(t => t.abbreviation === p.team || t.displayName === p.team);
        if (!mine || newMap[p.id]) continue;
        const opp = teams.find(t => t !== mine);
        newMap[p.id] = {state:"pre", detail: when, opp: opp ? opp.abbreviation : "", team: mine.abbreviation};
      }
      continue;
    }
    const sum = sums[started.indexOf(e)];
    if (!sum) continue;               // one game's box score failing shouldn't kill the rest
    for (const t of (sum.boxscore && sum.boxscore.players) || []){
      const stats = (t.statistics || [])[0];
      if (!stats) continue;
      const keys = stats.keys || [];
      const opp = teams.find(x => x.id !== t.team.id);
      const cs = comp.competitors || [];
      const myScore = (cs.find(c => c.team.id === t.team.id) || {}).score ?? "";
      const oppScore = (cs.find(c => c.team.id !== t.team.id) || {}).score ?? "";
      for (const a of stats.athletes || []){
        const id = String(a.athlete.id);
        const sv = a.stats || [];
        const num = k => { const i = keys.indexOf(k); const v = parseFloat(String(sv[i] ?? "").split("-")[0]); return isNaN(v) ? 0 : v; };
        const b = gsLine(keys, sv);
        if (b && (!best || b.gs > best.gs)) best = {...b, id, name: a.athlete.displayName};
        const line = {eid: String(e.id), state: st.state, detail: st.shortDetail || "", opp: opp ? opp.abbreviation : "", team: (t.team || {}).abbreviation || "",
          score: `${myScore}-${oppScore}`,
          min:num("minutes"), pts:num("points"), reb:num("rebounds"), ast:num("assists"),
          stl:num("steals"), blk:num("blocks"),
          tpm:num("threePointFieldGoalsMade-threePointFieldGoalsAttempted"), gs: b ? b.gs : 0};
        if (line.state === "in") inGame.push([id, a.athlete.displayName, line]);
        if (boardIds.has(id)) newMap[id] = line;
        else if (line.pts > 0 && !autoTried.has(id))
          extras.push({id, name: a.athlete.displayName, team: (t.team || {}).abbreviation || "", line});
      }
    }
  }
  // once someone scores tonight, they join the board (with their season log) and go live
  if (extras.length){
    for (const x of extras) autoTried.add(x.id);
    const loaded = await Promise.all(extras.map(x => loadPlayer(x.id, x.name, x.team, data.season).catch(() => null)));
    if (stale()){ for (const x of extras) autoTried.delete(x.id); return; }
    extras.forEach((x, i) => {
      const p = loaded[i];
      if (!p) return;                 // no season log; board players unaffected
      if (!data.players.some(q => String(q.id) === x.id)) data.players.push(p);
      newMap[x.id] = x.line;
    });
    makeSymbols(data.players);
  }
  const evHtml = inGame.flatMap(([id, name, line]) => emitEvents(id, name, line));
  liveMap = newMap;
  if (best){
    const allFinal = events.every(e => e.status.type.state === "post");
    todayPotn = true;
    setPotn(best, allFinal);
    if (allFinal) potnWinnerId = best.id;
  }

  // Current box: today's games with live scores
  const curr = document.getElementById("curr");
  curr.hidden = false;
  currGames.innerHTML = events.map(e => {
    const st = e.status.type;
    const cs = ((e.competitions || [])[0] || {}).competitors || [];
    const away = cs.find(c => c.homeAway === "away") || {}, home = cs.find(c => c.homeAway === "home") || {};
    const ab = x => (x.team || {}).abbreviation || "";
    if (st.state === "pre")
      return `<div>${ab(away)} @ ${ab(home)} · ${(st.shortDetail || "").replace(/^\d+\/\d+ - /, "")}</div>`;
    const when = st.state === "in" ? `<span class="gm-live">${st.shortDetail || ""}</span>` : "FINAL";
    return `<div><span class="gm-sc">${ab(away)} ${away.score ?? ""} @ ${ab(home)} ${home.score ?? ""}</span> · ${when}</div>`;
  }).join("");

  const nIn = events.filter(e => e.status.type.state === "in").length;
  const nPre = events.filter(e => e.status.type.state === "pre").length;
  if (nIn){
    currGames.hidden = true;
    pushEvents(evHtml);
  } else {
    currGames.hidden = false;
    currPlay.innerHTML = "";
    playQueue.length = 0;
  }
  const mkt = document.getElementById("mkt");
  const board = ` · ${data.seasonLabel} SEASON`;
  if (nIn){
    mkt.classList.add("live");
    mktTxt.textContent = `MARKET OPEN · ${nIn} LIVE GAME${nIn > 1 ? "S" : ""}` + board;
  } else if (nPre){
    mkt.classList.remove("live");
    mktTxt.textContent = `PRE-MARKET · ${events.length} GAME${events.length > 1 ? "S" : ""} TODAY` + board;
  } else {
    mkt.classList.remove("live");
    mktTxt.textContent = `MARKET CLOSED · TODAY'S SESSION FINAL` + board;
  }
  render();

  if (nIn || nPre){ clearTimeout(pollTimer); pollTimer = setTimeout(pollLive, nIn ? 45000 : 5 * 60000); }
}

/* ---------- demo: a simulated Wembanyama game (open the page with #demo) ---------- */
function runDemo(){
  const p = data.players.find(x => /Wembanyama/.test(x.name)) || data.players[0];
  const l = {state:"in", detail:"Q1 12:00", opp:"OKC", min:0, pts:0, reb:0, ast:0, stl:0, blk:0, tpm:0};
  liveMap = {[p.id]: l};
  emitEvents(p.id, p.name, l);   // baseline for the play feed
  const curr = document.getElementById("curr");
  curr.hidden = false;
  currGames.hidden = true;
  document.getElementById("mkt").classList.add("live");
  mktTxt.textContent = `MARKET OPEN · DEMO — SIMULATED ${p.name.toUpperCase()} GAME`;
  foot.textContent = "Demo mode: this game is simulated to show how live updates look. Remove #demo from the address for real data.";
  let q = 1, secLeft = 720;
  const timer = setInterval(() => {
    secLeft -= 90 + Math.floor(Math.random() * 40);
    if (secLeft <= 0){ q++; secLeft = 720; }
    const demoGs = () => l.pts + 0.7*l.ast + 0.3*l.reb + l.stl + 0.7*l.blk;
    if (q > 4){
      clearInterval(timer);
      l.state = "post"; l.detail = "Final";
      mktTxt.textContent = "MARKET CLOSED · DEMO OVER — RELOAD WITHOUT #demo FOR REAL DATA";
      setPotn({name: p.name, gs: demoGs(), pts: l.pts, reb: l.reb, ast: l.ast}, true);
      potnWinnerId = p.id;
      render();
      return;
    }
    const r = Math.random();
    if (r < .30) l.pts += 2;
    else if (r < .42){ l.pts += 3; l.tpm += 1; }
    else if (r < .52) l.pts += 1;
    else if (r < .76) l.reb += 1;
    else if (r < .90) l.ast += 1;
    else l.blk += 1;
    l.min = Math.min(38, l.min + 1.5);
    l.detail = `Q${q} ${Math.floor(secLeft / 60)}:${String(secLeft % 60).padStart(2, "0")}`;
    pushEvents(emitEvents(p.id, p.name, l));
    setPotn({name: p.name, gs: demoGs(), pts: l.pts, reb: l.reb, ast: l.ast}, false);
    render();
  }, 2200);
  render();
}

// On load, find the most recent completed night's winner so the badge survives reloads
async function fetchReigning(){
  if (potnWinnerId) return;
  try {
    const d = new Date(Date.now() - 86400000);
    const ds = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    const sb = await j(`${SB}/scoreboard?dates=${ds}`);
    const events = (sb.events || []).filter(e => e.status.type.state === "post" && (e.season || {}).type === 2);
    if (!events.length) return;
    let best = null;
    for (const e of events){
      const sum = await j(`${SB}/summary?event=${e.id}`);
      for (const t of (sum.boxscore && sum.boxscore.players) || []){
        const stats = (t.statistics || [])[0];
        if (!stats) continue;
        for (const a of stats.athletes || []){
          const b = gsLine(stats.keys || [], a.stats || []);
          if (b && (!best || b.gs > best.gs)) best = {...b, id: String(a.athlete.id), name: a.athlete.displayName};
        }
      }
    }
    if (best && !potnWinnerId){
      potnWinnerId = best.id;
      if (!todayPotn){
        setPotn(best, true);
        potnLbl.textContent = "Reigning Player of the Night";
      }
      render();
    }
  } catch (e) { /* no feed, no badge */ }
}

useSnapshot();
if (/(^|[?&#])demo/.test(location.search + location.hash)) runDemo();
else {
  pollLive();   // light the live layer right away, against the snapshot board
  tryLive().finally(() => { pollLive(); fetchReigning(); });
}
